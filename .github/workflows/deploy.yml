name: Azure CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - '*.bicep'
      - '.github/workflows/**'

permissions:
  id-token: write
  contents: read

jobs:
  # --- JOBB 1: Continuous Integration (CI) ---
  validate:
    name: Granska kod (CI)
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Bicep Lint (Syntax Check)
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az bicep build --file test-storage.bicep

  # --- JOBB 2: Continuous Deployment (CD) ---
  deploy:
    name: Bygg i Azure (CD)
    needs: validate
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group & Deploy
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az group create --name rg-cicd-lab --location swedencentral
            az deployment group create --resource-group rg-cicd-lab --template-file test-storage.bicep